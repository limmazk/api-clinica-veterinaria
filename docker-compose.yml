services:
  postgres:
    image: postgres:16
    container_name: clinica-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - clinica-data:/var/lib/postgresql/data

volumes:
  clinica-data: